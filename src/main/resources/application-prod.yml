spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/roombooking}
    username: ${DB_USERNAME:rooms}
    password: ${DB_PASSWORD:rooms}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

app:
  security:
    jwt-secret: ${JWT_SECRET}
    admin-user: ${APP_ADMIN_USER}
    admin-password: ${APP_ADMIN_PASSWORD}