spring:
  application:
    name: qabit_test_back_room_booking
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

app:
  security:
    token-ttl: 1h
  booking:
    zone: ${BOOKING_ZONE:UTC}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
