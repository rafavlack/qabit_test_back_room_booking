server:
  port: 8081

spring:
  datasource:
    url: jdbc:h2:mem:roombooking;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;LOCK_TIMEOUT=10000
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
  h2:
    console:
      enabled: true
  flyway:
    enabled: true

app:
  security:
    jwt-secret: ${JWT_SECRET:local-dev-only-secret-please-override-0123456789}
    admin-user: ${APP_ADMIN_USER:admin}
    admin-password: ${APP_ADMIN_PASSWORD:admin123}