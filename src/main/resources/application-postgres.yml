server:
  port: 8081

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/roombooking}
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD:admin123}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

app:
  security:
    jwt-secret: ${JWT_SECRET:local-dev-only-secret-please-override-0123456789}
    admin-user: ${APP_ADMIN_USER:admin}
    admin-password: ${APP_ADMIN_PASSWORD:admin123}
