services:
  postgres:
    image: postgres:16-alpine
    container_name: roombooking-postgres
    environment:
      POSTGRES_DB: roombooking
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"
    volumes:
      - roombooking-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d roombooking"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  roombooking-pgdata:
